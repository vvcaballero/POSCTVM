<header class="navbar-container">

  <div class="navbar-left">
    <div class="page-title">
      <h2>{{ tituloPagina }}</h2>
      <span>{{ descripcionPagina }}</span>
    </div>
  </div>

  <div class="navbar-right">

    <div class="navbar-date">
      <i class="bi bi-calendar3"></i>
      <span>{{ fechaActual | date:'dd/MM/yyyy' }}</span>
    </div>

    <!-- NOTIFICACIONES + MENÚ -->
    <div class="notif-wrapper">

      <button
        type="button"
        class="navbar-notification"
        (click)="alternarNotificaciones()"
        [attr.aria-expanded]="menuNotificacionesAbierto"
        title="Notificaciones">

        <i class="bi bi-bell"></i>

        <span class="notification-badge" *ngIf="totalNotificaciones > 0">
          {{ totalNotificaciones > 99 ? '99+' : totalNotificaciones }}
        </span>
      </button>

      <div class="notif-menu" *ngIf="menuNotificacionesAbierto">

        <div class="notif-header">
          <strong>Notificaciones</strong>
          <span *ngIf="totalNotificaciones > 0">{{ totalNotificaciones }}</span>
        </div>

        <div class="notif-list" *ngIf="totalNotificaciones > 0">
          <button
            type="button"
            class="notif-item"
            *ngFor="let n of notificacionesVisibles"
            (click)="irANotificacion(n)">

            <div class="notif-icon" [class.agotado]="n.tipo === 'agotado'">
              <i class="bi"
                 [class.bi-x-octagon]="n.tipo === 'agotado'"
                 [class.bi-exclamation-triangle]="n.tipo === 'stock-bajo'"></i>
            </div>

            <div class="notif-text">
              <strong>{{ n.titulo }}</strong>
              <span>{{ n.detalle }}</span>
            </div>
          </button>

          <p class="notif-more" *ngIf="notificacionesOcultas > 0">
            y {{ notificacionesOcultas }} más...
          </p>
        </div>

        <div class="notif-empty" *ngIf="totalNotificaciones === 0">
          <i class="bi bi-check-circle"></i>
          <strong>Todo en orden</strong>
          <span>No hay alertas por ahora.</span>
        </div>

        <button
          type="button"
          class="notif-footer"
          *ngIf="totalNotificaciones > 0"
          (click)="verInventario()">
          Ver inventario
        </button>

      </div>

    </div>

    <!-- PERFIL + MENÚ -->
    <div class="user-profile-wrapper">

      <button
        type="button"
        class="user-profile"
        (click)="alternarMenuUsuario()"
        [attr.aria-expanded]="menuUsuarioAbierto">

        <div class="user-avatar">
          <i class="bi bi-person-fill"></i>
        </div>

        <div class="user-info">
          <strong>{{ nombreUsuario }}</strong>
          <span>{{ rolUsuario }}</span>
        </div>

        <i class="bi bi-chevron-down chevron" [class.abierto]="menuUsuarioAbierto"></i>
      </button>

      <div class="user-menu" *ngIf="menuUsuarioAbierto">

        <div class="user-menu-header">
          <strong>{{ nombreUsuario }}</strong>
          <span>{{ rolUsuario }}</span>
        </div>

        <button type="button" class="user-menu-item logout" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right"></i>
          Cerrar sesión
        </button>

      </div>

    </div>

  </div>

</header>
