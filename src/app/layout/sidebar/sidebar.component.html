
<aside class="sidebar" *ngIf="permisos">

  <!-- LOGOTIPO -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <i class="bi bi-shop"></i>
    </div>

    <div class="brand-info">
      <h3>POSCTVM</h3>
      <span>Sistema Punto de Venta</span>
    </div>
  </div>

  <!-- MENÚ -->
  <div class="sidebar-menu">

    <!-- PRINCIPAL -->
    <ng-container *ngIf="
      tienePermiso('dashboardVer') ||
      tienePermiso('productosVer') ||
      tienePermiso('usuariosVer') ||
      tienePermiso('clientesVer')
    ">
      <p class="menu-title">PRINCIPAL</p>
    </ng-container>

    <!-- DASHBOARD -->
    <a
      *ngIf="tienePermiso('dashboardVer')"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item">

      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>

    <!-- PRODUCTOS -->
    <a
      *ngIf="tienePermiso('productosVer')"
      routerLink="/productos"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-box-seam"></i>
      <span>Productos</span>
    </a>

    <!-- CATEGORÍAS: usa el permiso de productos -->
<!-- CATEGORÍAS: solamente ADMIN -->
    <a
      *ngIf="esAdmin()"
      routerLink="/categorias"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-tags"></i>
      <span>Categorías</span>
    </a>

    <!-- USUARIOS -->
    <a
      *ngIf="tienePermiso('usuariosVer')"
      routerLink="/usuarios"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-people"></i>
      <span>Usuarios</span>
    </a>

    <!-- CLIENTES -->
    <a
      *ngIf="tienePermiso('clientesVer')"
      routerLink="/clientes"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-person-vcard"></i>
      <span>Clientes</span>
    </a>

    <!-- OPERACIONES -->
    <ng-container *ngIf="
      tienePermiso('puntoVentaVer') ||
      tienePermiso('ventasVer') ||
      tienePermiso('inventarioVer')
    ">
      <p class="menu-title">OPERACIONES</p>
    </ng-container>

    <!-- PUNTO DE VENTA -->
    <a
      *ngIf="tienePermiso('puntoVentaVer')"
      routerLink="/punto-venta"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-cart-plus"></i>
      <span>Punto de venta</span>
    </a>

    <!-- HISTORIAL DE VENTAS -->
    <a
      *ngIf="tienePermiso('ventasVer')"
      routerLink="/ventas"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-receipt"></i>
      <span>Historial de ventas</span>
    </a>

    <!-- INVENTARIO -->
    <a
      *ngIf="tienePermiso('inventarioVer')"
      routerLink="/inventario"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-clipboard-data"></i>
      <span>Inventario</span>
    </a>

    <!-- ADMINISTRACIÓN -->
    <ng-container *ngIf="
      tienePermiso('reportesVer') ||
      tienePermiso('configuracionVer')
    ">
      <p class="menu-title">ADMINISTRACIÓN</p>
    </ng-container>

    <!-- REPORTES -->
    <a
      *ngIf="tienePermiso('reportesVer')"
      routerLink="/reportes"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-bar-chart-line"></i>
      <span>Reportes</span>
    </a>

    <!-- CONFIGURACIÓN -->
    <a
      *ngIf="tienePermiso('configuracionVer')"
      routerLink="/configuracion"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-gear"></i>
      <span>Configuración</span>
    </a>

    <!-- PEDIDOS DE CLIENTES -->
    <!-- Se relaciona provisionalmente con ventasVer porque
         todavía no existe un permiso propio en PermisoRol. -->
    <a
      *ngIf="tienePermiso('ventasVer')"
      routerLink="/pedidos-clientes"
      routerLinkActive="active"
      class="menu-item">

      <i class="bi bi-clipboard-check"></i>
      <span>Pedidos de clientes</span>
    </a>

  </div>

  <!-- PIE DEL MENÚ -->
  <div class="sidebar-footer">

    <div class="footer-status">
      <span class="status-indicator"></span>
      Sistema activo
    </div>

    <span>POSCTVM © 2026</span>

  </div>

</aside>
