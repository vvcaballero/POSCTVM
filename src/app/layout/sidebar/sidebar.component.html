
<aside class="sidebar">

  <!-- LOGOTIPO -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <i class="bi bi-shop"></i>
    </div>

    <div class="brand-info">
      <h3>POSCTVM</h3>
      <span>Sistema Punto de Venta</span>
    </div>
  </div>

  <!-- MENÚ -->
  <div class="sidebar-menu">

    <p class="menu-title">PRINCIPAL</p>

    <!-- DASHBOARD -->
    <a routerLink="/dashboard"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="menu-item">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>

    <!-- PRODUCTOS -->
    <a routerLink="/productos"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-box-seam"></i>
      <span>Productos</span>
    </a>

    <!-- CATEGORÍAS -->
    <a routerLink="/categorias"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-tags"></i>
      <span>Categorías</span>
    </a>

    <!-- USUARIOS -->
    <a routerLink="/usuarios"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-people"></i>
      <span>Usuarios</span>
    </a>

    <!-- CLIENTES -->
    <a routerLink="/clientes"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-person-vcard"></i>
      <span>Clientes</span>
    </a>

    <p class="menu-title">OPERACIONES</p>

    <!-- PUNTO DE VENTA -->
    <a routerLink="/punto-venta"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-cart-plus"></i>
      <span>Punto de venta</span>
    </a>

    <!-- HISTORIAL DE VENTAS -->
    <a routerLink="/ventas"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-receipt"></i>
      <span>Historial de ventas</span>
    </a>

    <!-- INVENTARIO -->
    <a routerLink="/inventario"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-clipboard-data"></i>
      <span>Inventario</span>
    </a>

    <p class="menu-title">ADMINISTRACIÓN</p>

    <!-- REPORTES -->
    <a routerLink="/reportes"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-bar-chart-line"></i>
      <span>Reportes</span>
    </a>

    <!-- CONFIGURACIÓN -->
    <a routerLink="/configuracion"
       routerLinkActive="active"
       class="menu-item">
      <i class="bi bi-gear"></i>
      <span>Configuración</span>
    </a>


    <a
      routerLink="/pedidos-clientes"
      routerLinkActive="active"
      class="menu-item">
      <i class="bi bi-clipboard-check"></i>
      <span>Pedidos de clientes</span>
    </a>



  </div>

  <!-- PIE DEL MENÚ -->
  <div class="sidebar-footer">

    <div class="footer-status">
      <span class="status-indicator"></span>
      Sistema activo
    </div>

    <span>POSCTVM © 2026</span>

  </div>

</aside>
