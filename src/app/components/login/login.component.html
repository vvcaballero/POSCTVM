
<div class="login-container">

  <div class="login-card">

    <div class="login-header">

      <div class="login-icon">
        <i class="bi bi-shop"></i>
      </div>

      <h2>POSCTVM</h2>

      <p>Sistema Punto de Venta</p>

    </div>

    <div class="login-body">

      <h4>Bienvenido</h4>

      <p class="login-description">
        Ingresa tus credenciales para continuar
      </p>

      <div *ngIf="mensajeError" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i>
        {{ mensajeError }}
      </div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

        <div class="form-group">

          <label>Usuario</label>

          <div class="input-container">

            <i class="bi bi-person"></i>

            <input
              type="text"
              name="username"
              [(ngModel)]="usuario.username"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              required>

          </div>

        </div>

        <div class="form-group">

          <label>Contraseña</label>

          <div class="input-container">

            <i class="bi bi-lock"></i>

            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="usuario.password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required>

            <button
              type="button"
              class="password-toggle"
              (click)="mostrarPassword = !mostrarPassword">

              <i [class]="mostrarPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>

            </button>

          </div>

        </div>

        <button
          type="submit"
          class="btn-login"
          [disabled]="cargando || !loginForm.valid">

          <span *ngIf="!cargando">
            Iniciar sesión
            <i class="bi bi-arrow-right"></i>
          </span>

          <span *ngIf="cargando">
            <span class="spinner-border spinner-border-sm"></span>
            Verificando...
          </span>

        </button>

      </form>

    </div>

    <div class="login-footer">
      POSCTVM © 2026
    </div>

  </div>

</div>
